<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>medleyplay</title>
    <script>
      {
        const get = (path) => fetch(path, { credentials: "same-origin" });
        const device = get("/api/device");
        const account = device.then(
          async (response) => {
            if (!response.ok) return;
            const info = await response
              .clone()
              .json()
              .catch(() => undefined);
            if (["host", "allowed", "admitted"].includes(info?.presence)) {
              return get("/api/me");
            }
          },
          () => undefined,
        );
        void account.catch(() => {});
        window.medleyplayFirstReads = { device, account };
      }
    </script>
    <script>
      // Before the first paint, the theme this browser chose, as theme.ts applies it.
      try {
        const theme = localStorage.getItem("medleyplay.theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Storage that can't be read leaves the system's theme.
      }
    </script>
  </head>
  <body>
    <div id="root"><p class="starting" aria-busy="true">medleyplay</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
